<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seletor de Data — Mínimo 2 dias úteis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: transparent;
    color: #000;
    padding: 8px 0;
  }

  .date-field {
    max-width: 400px;
  }

  .date-field label {
    display: block;
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 6px;
  }

  .date-field .hint {
    font-size: 18px;
    color: #666;
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .date-input-wrapper {
    position: relative;
  }

  .date-input-wrapper input[type="date"] {
    width: 100%;
    padding: 10px 14px;
    font-size: 18px;
    font-family: Arial, Helvetica, sans-serif;
    border: 1.5px solid #d0d0d0;
    border-radius: 6px;
    background: #fff;
    color: #1a1a1a;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    -webkit-appearance: none;
  }

  .date-input-wrapper input[type="date"]:focus {
    border-color: #E9030F;
    box-shadow: 0 0 0 2.5px rgba(233, 3, 15, 0.15);
  }

  .date-input-wrapper input[type="date"]:invalid,
  .date-input-wrapper input[type="date"].invalid {
    border-color: #E9030F;
  }

  .validation-msg {
    margin-top: 6px;
    font-size: 12.5px;
    line-height: 1.4;
    min-height: 18px;
    transition: opacity 0.2s;
  }

  .validation-msg.error {
    color: #E9030F;
  }

  .validation-msg.success {
    color: #16a34a;
  }

  /* Hidden field that stores the selected date for Tally */
  .tally-hidden-value {
    display: none;
  }
</style>
</head>
<body>

<div class="date-field">
  <label for="datePicker">Data desejada</label>
  <div class="hint" id="hintText">Selecione uma data a partir de <strong id="minDateDisplay"></strong></div>
  <div class="date-input-wrapper">
    <input type="date" id="datePicker" />
  </div>
  <div class="validation-msg" id="validationMsg"></div>
</div>

<!-- 
  COMO USAR NO TALLY:
  
  Opção A — Embed block dentro do Tally:
  No Tally, digite /embed e cole a URL onde este HTML está hospedado
  (pode ser GitHub Pages, Netlify, ou qualquer hosting estático).
  
  Opção B — Code Injection (Tally Pro + Custom Domain):
  Cole o <script> abaixo no code injection do formulário.
  Ele vai interceptar o campo de data nativo do Tally e aplicar a restrição.
  
  Opção C — Embed do Tally no seu site:
  Se o formulário Tally está embeddado no SEU site, cole este script
  no seu site junto com o iframe do Tally.
-->

<script>
(function() {
  // === CONFIGURAÇÃO ===
  const DIAS_MINIMOS = 2; // Mínimo de dias à frente (altere aqui se quiser)
  
  // === CÁLCULO DA DATA MÍNIMA ===
  function calcMinDate() {
    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);
    const minima = new Date(hoje);
    minima.setDate(minima.getDate() + DIAS_MINIMOS);
    return minima;
  }

  function formatISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }

  function formatBR(d) {
    const dd = String(d.getDate()).padStart(2, '0');
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const y = d.getFullYear();
    return `${dd}/${m}/${y}`;
  }

  // === SETUP ===
  const minDate = calcMinDate();
  const picker = document.getElementById('datePicker');
  const msg = document.getElementById('validationMsg');
  const minDisplay = document.getElementById('minDateDisplay');

  // Define o min no input e exibe a data mínima
  picker.setAttribute('min', formatISO(minDate));
  picker.value = ''; 
  minDisplay.textContent = formatBR(minDate);

  // === VALIDAÇÃO ===
  picker.addEventListener('change', function() {
    const selected = new Date(this.value + 'T00:00:00');
    
    if (selected < minDate) {
      this.classList.add('invalid');
      msg.className = 'validation-msg error';
      msg.innerHTML = `⚠️ Data inválida. Selecione a partir de <strong>${formatBR(minDate)}</strong> (mínimo ${DIAS_MINIMOS} dias a partir de hoje).`;
      this.value = ''; // Limpa a seleção inválida
    } else {
      this.classList.remove('invalid');
      msg.className = 'validation-msg success';
      msg.innerHTML = `✓ Data selecionada: <strong>${formatBR(selected)}</strong>`;
    }
  });
})();
</script>

</body>
</html>
