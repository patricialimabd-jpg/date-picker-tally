<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data desejada</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    color: #1F1F1F;
    line-height: 1.4;
    overflow: hidden;
  }

  .date-field label {
    display: block;
    font-size: 17px;
    font-weight: 700;
    color: #1F1F1F;
    margin-bottom: 2px;
  }

  .date-field label .required {
    color: #AFAFAF;
    font-weight: 400;
    margin-left: 3px;
    font-size: 15px;
  }

  .date-field .hint {
    font-size: 13px;
    color: #6B6B6B;
    margin-bottom: 8px;
  }

  .date-field input[type="date"] {
    width: 100%;
    max-width: 320px;
    padding: 10px 14px;
    font-size: 13px;
    font-family: inherit;
    border: 1px solid #E0E0E0;
    border-radius: 10px;
    background: #FFFFFF;
    color: #1F1F1F;
    transition: border-color 0.2s;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  .date-field input[type="date"]:hover { border-color: #C0C0C0; }
  .date-field input[type="date"]:focus { border-color: #1F1F1F; }
  .date-field input[type="date"].invalid { border-color: #E9030F; }

  .validation-msg {
    margin-top: 4px;
    font-size: 13px;
    min-height: 16px;
  }

  .validation-msg.error { color: #E9030F; }
  .validation-msg.success { color: #1a8a3f; }
</style>
</head>
<body>
<div class="date-field">
  <label for="dp">Data desejada <span class="required">*</span></label>
  <div class="hint">Selecione a partir de <strong id="md"></strong></div>
  <input type="date" id="dp" required />
  <div class="validation-msg" id="vm"></div>
</div>
<script>
(function(){
  var D=2,h=new Date();h.setHours(0,0,0,0);h.setDate(h.getDate()+D);
  var p=document.getElementById('dp'),m=document.getElementById('vm'),
      iso=h.toISOString().slice(0,10),
      br=iso.slice(8)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4);
  document.getElementById('md').textContent=br;
  p.setAttribute('min',iso);
  p.addEventListener('change',function(){
    var s=new Date(this.value+'T00:00:00');
    if(s<h){this.classList.add('invalid');m.className='validation-msg error';
      m.innerHTML='Selecione a partir de <strong>'+br+'</strong>';this.value='';}
    else{this.classList.remove('invalid');m.className='validation-msg success';
      var d=this.value.slice(8)+'/'+this.value.slice(5,7)+'/'+this.value.slice(0,4);
      m.innerHTML='✓ '+d;}
  });
})();
</script>
</body>
</html>
